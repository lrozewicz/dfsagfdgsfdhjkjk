# True baseline - exactly as default_config.py but with 1% data for fair comparison
# This represents the "pure" framework baseline without triplet loss modifications

model:
  name: 'resnet50'  # Not resnet50_fc512 - pure ResNet50 as in default_config.py

data:
  type: 'image'
  root: 'datasets'
  height: 256
  width: 128
  workers: 8
  sources: ['soccernetv3']
  targets: ['soccernetv3', 'soccernetv3_test', 'soccernetv3_challenge']

soccernetv3:
  training_subset: 0.01  # 1% for fair comparison with other experiments (not 1.0 as in default)

sampler:
  train_sampler: RandomIdentitySampler
  train_sampler_t: RandomIdentitySampler
  num_instances: 4

loss:
  name: 'softmax'  # Pure classification - no triplet component
  softmax:
    label_smooth: True

train:
  batch_size: 32  # Smaller batch as in default_config.py
  print_freq: 10
  max_epoch: 60
  lr: 0.0003
  weight_decay: 5e-4

test:
  ranks: [1, 5, 10, 20]
  export_ranking_results: True
  eval_freq: 10